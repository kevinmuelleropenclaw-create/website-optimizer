<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Optimizer</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:#0b1220;color:#e6eaf2}
    .container{max-width:880px;margin:0 auto;padding:28px}
    .card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:14px;padding:18px}
    label{display:block;margin:10px 0 6px;color:rgba(230,234,242,.85)}
    input{width:100%;padding:12px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);color:#e6eaf2}
    button{margin-top:12px;padding:10px 14px;border-radius:12px;border:0;background:#0b5fff;color:white;font-weight:700;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .muted{color:rgba(230,234,242,.75)}
    .bar{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
    .bar > div{height:100%;width:0%;background:#0b5fff;transition:width .25s ease}
    .steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:rgba(230,234,242,.78);font-size:13px}
    .pill.active{border-color:#0b5fff;color:#e6eaf2}
    a{color:#7db0ff}
    .error{color:#ffb4b4}
  </style>
</head>
<body>
  <div class="container">
    <h1>Website Optimizer</h1>
    <p class="muted">URL eingeben → Scraping → AI Analyse → Optimierung → Netlify Deployment</p>

    <div class="card">
      <form id="form">
        <label for="url">Website-URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com" required />
        <button id="submit" type="submit">Optimierung starten</button>
      </form>

      <div id="progressWrap" style="display:none;margin-top:16px">
        <div class="row">
          <div>
            <div id="status" style="font-weight:700">Warte…</div>
            <div id="detail" class="muted">—</div>
          </div>
          <div id="percent" class="muted">0%</div>
        </div>
        <div class="bar" style="margin-top:10px"><div id="bar"></div></div>
        <div class="steps">
          <div class="pill" data-step="scraping">Scraping</div>
          <div class="pill" data-step="analysis">Analyse</div>
          <div class="pill" data-step="optimization">Optimierung</div>
          <div class="pill" data-step="deployment">Deployment</div>
          <div class="pill" data-step="done">Fertig</div>
        </div>
        <div id="result" style="margin-top:12px"></div>
      </div>

      <div id="error" class="error" style="margin-top:12px"></div>
    </div>

    <p class="muted" style="margin-top:18px">Hinweis: AI-Analyse nutzt optional OpenAI. Ohne Key wird eine heuristische Analyse verwendet.</p>
  </div>

  <script>
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit');
    const progressWrap = document.getElementById('progressWrap');
    const statusEl = document.getElementById('status');
    const detailEl = document.getElementById('detail');
    const percentEl = document.getElementById('percent');
    const barEl = document.getElementById('bar');
    const resultEl = document.getElementById('result');
    const errorEl = document.getElementById('error');

    function setActiveStep(step){
      document.querySelectorAll('.pill').forEach(p => {
        p.classList.toggle('active', p.dataset.step === step);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      resultEl.innerHTML = '';
      submitBtn.disabled = true;
      progressWrap.style.display = 'block';
      barEl.style.width = '0%';
      percentEl.textContent = '0%';
      statusEl.textContent = 'Job wird erstellt…';
      detailEl.textContent = '';

      const url = document.getElementById('url').value;

      let job;
      try {
        const res = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url })
        });
        job = await res.json();
        if(!res.ok) throw new Error(job.error || 'Unbekannter Fehler');
      } catch (err) {
        errorEl.textContent = String(err.message || err);
        submitBtn.disabled = false;
        return;
      }

      statusEl.textContent = 'Job gestartet';
      detailEl.textContent = 'ID: ' + job.id;

      const es = new EventSource(`/api/jobs/${job.id}/events`);
      es.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        const p = Math.max(0, Math.min(100, data.progress || 0));
        barEl.style.width = p + '%';
        percentEl.textContent = p + '%';
        statusEl.textContent = data.status;
        detailEl.textContent = data.step;
        setActiveStep(data.step);

        if (data.status === 'done') {
          es.close();
          setActiveStep('done');
          resultEl.innerHTML = `✅ Fertig. Optimierte Website: <a href="${data.netlifyUrl}" target="_blank" rel="noreferrer">${data.netlifyUrl}</a>`;
          submitBtn.disabled = false;
        }
        if (data.status === 'failed') {
          es.close();
          resultEl.innerHTML = '';
          errorEl.textContent = data.error || 'Job fehlgeschlagen';
          submitBtn.disabled = false;
        }
      };
      es.onerror = () => {
        // keep UI, fallback to polling could be added
      };
    });
  </script>
</body>
</html>
